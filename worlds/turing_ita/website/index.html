<!DOCTYPE html>

<meta name="color-scheme" content="dark light">
<title>Hotel delle Imitazioni</title>
<script>
/* Debug overlay: every JS error, unhandled promise rejection and failed resource load is shown in a
   panel at the bottom of the page (it only appears when something actually goes wrong). Registered
   inline BEFORE any other script, so it also catches CDN load failures and app.js syntax errors. */
(function () {
  function show(msg) {
    var box = document.getElementById("js-errors");
    if (!box) {
      box = document.createElement("div");
      box.id = "js-errors";
      box.style.cssText = "position:fixed;left:0;right:0;bottom:0;max-height:40vh;overflow:auto;" +
        "background:#3a0d0d;color:#ffb3b3;font:12px/1.5 monospace;padding:8px 12px;z-index:9999;" +
        "white-space:pre-wrap;border-top:2px solid #c33;";
      (document.body || document.documentElement).appendChild(box);
    }
    var line = document.createElement("div");
    line.textContent = "⚠ " + msg;
    box.appendChild(line);
  }
  window.addEventListener("error", function (e) {
    if (e.message) {
      show(e.message + " @ " + (e.filename || "?") + ":" + (e.lineno || "?") +
           (e.error && e.error.stack ? "\n" + e.error.stack : ""));
    } else {
      show("resource failed to load: " +
           ((e.target && (e.target.src || e.target.href)) || "?"));
    }
  }, true);
  window.addEventListener("unhandledrejection", function (e) {
    var r = e.reason;
    show("unhandled rejection: " + ((r && (r.stack || r.message)) || r));
  });
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
